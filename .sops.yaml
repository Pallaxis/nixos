keys:
  - &homelab 
  - &henry 
  - &system 
creation_rules:
  - path_regex: ^secrets/homelab\.yaml$
    key_groups:
      - age:
          - *homelab
  - path_regex: ^secrets/henry\.yaml$
    key_groups:
      - age:
          - *henry
  - path_regex: ^secrets/system\.yaml$
    key_groups:
      - age:
          - *system
stores:
  yaml:
    indent: 2
