keys:
  - &homelab 
  - &core 
  - &nixos 
creation_rules:
  - path_regex: ^secrets/homelab\.yaml$
    key_groups:
      - age:
          - *homelab
  - path_regex: ^secrets/core\.yaml$
    key_groups:
      - age:
          - *core
  - path_regex: ^secrets/nixos\.yaml$
    key_groups:
      - age:
          - *nixos
stores:
  yaml:
    indent: 2
